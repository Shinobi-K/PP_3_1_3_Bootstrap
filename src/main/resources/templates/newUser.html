<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Новый пользователь</title>
</head>
<body>
<h1>Добавить пользователя</h1>

<form action="/admin/new" method="post">
  <label>Имя: <input type="text" name="name"/></label><br/>
  <label>Фамилия: <input type="text" name="lastName"/></label><br/>
  <label>Email: <input type="text" name="email"/></label><br/>
  <label>Username: <input type="text" name="username"/></label><br/>
  <label>Пароль: <input type="password" name="password"/></label><br/>
  <label>Роли: <select name="roles" multiple> <option value="1">ROLE_USER</option> <option value="2">ROLE_ADMIN</option> </select></label><br/>
  <button type="submit">Сохранить</button>
</form>

<br/>
<a href="/admin"></a>
</body>
</html>
