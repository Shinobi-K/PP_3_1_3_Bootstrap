<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Page</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>

        body {
            background: #f8f9fa;
            margin: 0;
        }

        .top-bar {
            background: #343a40;
            min-height: 40px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar .email {
            color: #fff;
            font-weight: 600;
        }

        .top-bar .logout {
            color: #fff;
            background: transparent;
            border: 0;
            cursor: pointer;
            padding: 0;
        }

        .sidebar {
            background: #fff;
            min-height: calc(100vh - 40px);
            padding: 10px 0 0;
        }

        .sidebar a {
            display: block;
            padding: 4px 8px;
            color: #007bff;
            text-decoration: none;
        }

        .sidebar a.active {
            background: #007bff;
            color: #fff;
        }

        .main-content {
            padding: 10px 18px;
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .panel {
            background: #fff;
            border: 1px solid #dee2e6;
        }

        .panel-header {
            padding: 7px 10px;
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
        }

        .panel-body {
            padding: 10px;
        }

        .table {
            margin-bottom: 0;
        }

        .table th, .table td {
            vertical-align: middle;
        }

    </style>
</head>

<body>

<!-- Верхняя панель -->
<div class="top-bar">
    <span class="email" th:text="${authUser.email + ' with roles: ' + authUser.rolesAsString}">admin@mail.ru with roles: ADMIN USER</span>

    <form th:action="@{/logout}" method="post" class="mb-0">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button type="submit" class="logout">Logout</button>

    </form>

    </div>

<div class="container-fluid">

    <div class="row">

<!-- Боковая панель -->
        <div class="col-md-2 sidebar">

            <a href="/admin" th:if="${isAdmin}">Admin</a>

            <a href="/user" class="active">User</a>

        </div>

        <!-- Основная часть -->
        <div class="col-md-10 main-content">

            <div class="page-title">User information-page</div>

            <div class="panel">

                <div class="panel-header">About user</div>

                <div class="panel-body">

                    <table class="table table-bordered">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr>

                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.name}">Admin</td>
                            <td th:text="${user.lastName}">Adminov</td>
                            <td th:text="${user.age}">36</td>
                            <td th:text="${user.email}">admin@mail.ru</td>
                            <td th:text="${user.rolesAsString}">ADMIN USER</td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
