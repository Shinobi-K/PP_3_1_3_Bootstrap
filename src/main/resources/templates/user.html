<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
</head>
<body>
<h1>Личный кабинет</h1>

<p><strong>ID</strong> <span th:text="${userid}">1</span></p>
<p><strong>Имя:</strong> <span th:text="${user.name}">Иван</span></p>
<p><strong>Фамилия:</strong> <span th:text="${user.lastName}">Иванов</span></p>
<p><strong>Email:</strong> <span th:text="${user.email}">ivan@mail.ru</span></p>
<p><strong>Username:</strong> <span th:text="${user.username}">ivan</span></p>
<p><strong>Роли:</strong> <span th:text="${user.roles}">USER</span></p>

<br/>
<a href="/logout">Выйти</a>
</body>
</html>
